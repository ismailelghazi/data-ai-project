version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: emotion-detection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ism55515@}
      POSTGRES_DB: ${DB_NAME:-test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - emotion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend + ML Model
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: emotion-detection-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Ism55515@}@db:5432/${DB_NAME:-test}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Ism55515@}
      DB_SERVER: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-test}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - emotion-network
    volumes:
      # Mount models for development (optional - comment out for production)
      - ./ML/models:/app/ML/models:ro

  # Nginx Frontend
  ui:
    build:
      context: .
      dockerfile: UI/Dockerfile
    container_name: emotion-detection-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - emotion-network

volumes:
  postgres_data:
    driver: local

networks:
  emotion-network:
    driver: bridge
